<style>/* Layout: app shell — sticky header with business switcher + tab bar, one centered column of panels per tab, bottom sheet for every form. */
:root {
  --bg: #f4f3f6;
  --surface: #ffffff;
  --ink: #1d1a24;
  --muted: #676174;
  --line: #e1dee8;
  --accent: #5b2a6e;
  --accent-ink: #ffffff;
  --accent-soft: #efe5f3;
  --in: #14845f;
  --in-soft: #dcf2e8;
  --out: #c2412d;
  --out-soft: #fbe3de;
  --warn: #a8670a;
  --warn-soft: #fbefd9;
  --in-ink: #ffffff;
  --out-ink: #ffffff;
  --chip: #ebe8f0;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121016; --surface: #1c1922; --ink: #ece8f2; --muted: #a39cb0; --line: #2f2a38;
  --accent: #c9a0dc; --accent-ink: #1a1220; --accent-soft: #2e2238; --in: #4fd29f; --in-soft: #173a2d; --out: #ff8a75; --out-soft: #43221c;
  --warn: #f2b65a; --warn-soft: #3b2c14; --chip: #28232f; --in-ink: #0d2119; --out-ink: #2b0f0a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121016; --surface: #1c1922; --ink: #ece8f2; --muted: #a39cb0; --line: #2f2a38;
  --accent: #c9a0dc; --accent-ink: #1a1220; --accent-soft: #2e2238; --in: #4fd29f; --in-soft: #173a2d; --out: #ff8a75; --out-soft: #43221c;
  --warn: #f2b65a; --warn-soft: #3b2c14; --chip: #28232f; --in-ink: #0d2119; --out-ink: #2b0f0a; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); }
</style><style>/* Storefront — tienda pública. Todo bajo .sf; colores solo desde tokens del host o el color de marca. */
.sf {
  --sf-brand: var(--sf-b, var(--accent));
  --sf-brand-ink: var(--sf-b-ink, var(--accent-ink));
  --sf-brand-tx: var(--sf-b-tx, var(--accent));
  --sf-brand-hov: var(--sf-b-hov, color-mix(in srgb, var(--sf-brand) 88%, var(--ink)));
  --sf-soft: color-mix(in srgb, var(--sf-brand) 12%, var(--surface));
  --sf-wash: color-mix(in srgb, var(--sf-brand) 7%, var(--bg));
  --sf-safe-t: env(safe-area-inset-top, 0px);
  --sf-safe-b: env(safe-area-inset-bottom, 0px);
  --sf-gl: max(16px, env(safe-area-inset-left, 0px));
  --sf-gr: max(16px, env(safe-area-inset-right, 0px));
  --sf-top: 0px;
  --sf-r: 14px;
  --sf-max: 1180px;
  display: block;
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  overflow-x: clip;
  /* Palabras largas (enlaces, correos) se parten en vez de ensanchar la columna. */
  overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .sf {
    --sf-brand: var(--sf-bd, var(--accent));
    --sf-brand-ink: var(--sf-bd-ink, var(--accent-ink));
    --sf-brand-tx: var(--sf-bd-tx, var(--accent));
    --sf-brand-hov: var(--sf-bd-hov, color-mix(in srgb, var(--sf-brand) 88%, var(--ink)));
  }
}
:root[data-theme="dark"] .sf {
  --sf-brand: var(--sf-bd, var(--accent));
  --sf-brand-ink: var(--sf-bd-ink, var(--accent-ink));
  --sf-brand-tx: var(--sf-bd-tx, var(--accent));
  --sf-brand-hov: var(--sf-bd-hov, color-mix(in srgb, var(--sf-brand) 88%, var(--ink)));
}
.sf.sf-has-pv { --sf-top: 44px; }
.sf *, .sf *::before, .sf *::after { box-sizing: border-box; }
.sf [hidden] { display: none !important; }
.sf h1, .sf h2, .sf h3, .sf p, .sf ul, .sf dl, .sf dd, .sf pre, .sf fieldset { margin: 0; }
.sf ul { padding: 0; list-style: none; }
.sf button, .sf input, .sf select, .sf textarea { font: inherit; color: inherit; letter-spacing: inherit; }
.sf button { -webkit-tap-highlight-color: transparent; }
.sf :focus { outline: none; }
.sf :focus-visible { outline: 2px solid var(--sf-brand-tx); outline-offset: 2px; }
.sf [tabindex="-1"]:focus-visible { outline: none; }
.sf .sf-num { font-variant-numeric: tabular-nums; }
.sf .sf-muted { color: var(--muted); font-weight: 500; }
.sf .sf-right { text-align: right; }
.sf .sf-nw { white-space: nowrap; }
.sf .sf-sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.sf .sf-offscreen { position: fixed; top: 0; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.sf .sf-ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- botones ---------- */
.sf .sf-btn {
  appearance: none; -webkit-appearance: none; border: 0; margin: 0;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 12px 20px; border-radius: 999px;
  font-weight: 650; font-size: .95rem; line-height: 1.2; text-decoration: none; text-align: center;
  cursor: pointer; transition: background-color .15s, color .15s, border-color .15s, transform .1s;
}
.sf .sf-btn:active { transform: scale(.985); }
.sf .sf-btn-pri { background: var(--sf-brand); color: var(--sf-brand-ink); }
.sf .sf-btn-pri:hover { background: var(--sf-brand-hov); }
.sf .sf-btn-ghost { background: var(--chip); color: var(--ink); }
.sf .sf-btn-ghost:hover { background: color-mix(in srgb, var(--chip) 90%, var(--ink)); }
.sf .sf-btn-line { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.sf .sf-btn-line:hover { border-color: var(--ink); }
.sf .sf-btn-sm { min-height: 40px; padding: 8px 14px; font-size: .88rem; }
.sf .sf-btn:disabled, .sf .sf-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; transform: none; }
.sf .sf-a { color: var(--sf-brand-tx); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.sf .sf-icon-btn {
  appearance: none; border: 0; flex: none; width: 40px; height: 40px; border-radius: 999px;
  display: inline-grid; place-items: center; background: var(--chip); color: var(--ink); cursor: pointer;
}
.sf .sf-icon-btn:hover { background: color-mix(in srgb, var(--chip) 75%, var(--ink)); }
.sf .sf-linkbtn {
  appearance: none; border: 0; background: none; padding: 6px 2px; min-height: 36px; cursor: pointer;
  color: var(--muted); font-size: .85rem; text-decoration: underline; text-underline-offset: 3px;
}
.sf .sf-linkbtn:hover { color: var(--out); }

/* ---------- vista previa ---------- */
.sf .sf-pv {
  position: sticky; top: 0; z-index: 45;
  height: calc(44px + var(--sf-safe-t)); padding: var(--sf-safe-t) var(--sf-gr) 0 var(--sf-gl);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--ink); color: var(--bg); font-size: .84rem;
}
.sf .sf-pv-t { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; }
.sf .sf-pv-t b { font-weight: 700; }
.sf .sf-pv-s { opacity: .72; overflow: hidden; text-overflow: ellipsis; }
.sf .sf-pv-btn {
  appearance: none; border: 0; flex: none; min-height: 32px; padding: 5px 14px; border-radius: 999px;
  background: var(--bg); color: var(--ink); font-weight: 700; font-size: .82rem; cursor: pointer;
}
.sf .sf-pv-btn:focus-visible { outline-color: var(--bg); }
@media (max-width: 420px) { .sf .sf-pv-s { display: none; } }

/* ---------- encabezado de la tienda ---------- */
.sf .sf-head { background: var(--sf-wash); border-top: 3px solid var(--sf-brand); border-bottom: 1px solid var(--line); }
.sf .sf-head-in {
  max-width: var(--sf-max); margin: 0 auto; padding: 22px var(--sf-gr) 20px var(--sf-gl);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 14px; align-items: center;
}
.sf .sf-mark {
  width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; align-self: start; margin-top: 2px;
  background: var(--sf-brand); color: var(--sf-brand-ink);
  font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1;
}
.sf .sf-head-txt { min-width: 0; }
.sf .sf-eyebrow {
  display: inline-flex; align-items: center; gap: 6px; margin-bottom: 6px;
  font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--sf-brand-tx);
}
.sf .sf-eyebrow .sf-ic { width: 15px; height: 15px; }
.sf .sf-title {
  font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 6.2vw, 2.9rem);
  line-height: 1.02; letter-spacing: -.025em; overflow-wrap: anywhere; text-wrap: balance;
}
.sf .sf-slogan { margin-top: 6px; color: var(--muted); font-size: .98rem; text-wrap: pretty; }
.sf .sf-tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.sf .sf-tag {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: .8rem; font-weight: 600; color: var(--ink);
}
.sf .sf-tag .sf-ic { width: 16px; height: 16px; color: var(--sf-brand-tx); }
.sf .sf-tag-soft { background: var(--sf-soft); border-color: transparent; color: var(--sf-brand-tx); }
@media (min-width: 760px) {
  .sf .sf-head-in { grid-template-columns: auto minmax(0, 1fr) auto; padding-top: 34px; padding-bottom: 30px; gap: 20px; }
  .sf .sf-mark { width: 72px; height: 72px; border-radius: 20px; font-size: 2.1rem; }
  .sf .sf-tags { grid-column: auto; flex-direction: column; align-items: flex-end; align-self: end; }
}

/* ---------- barra de búsqueda y categorías ---------- */
.sf .sf-tools {
  position: sticky; top: calc(var(--sf-top) + var(--sf-safe-t)); z-index: 30;
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.sf.sf-has-pv .sf-tools { top: calc(var(--sf-top) + var(--sf-safe-t)); }
.sf .sf-tools-in { max-width: var(--sf-max); margin: 0 auto; padding: 10px var(--sf-gr) 0 var(--sf-gl); display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.sf .sf-search { position: relative; min-width: 0; }
.sf .sf-search > .sf-ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.sf .sf-input {
  display: block; width: 100%; min-width: 0; margin: 0;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 13px; font-size: 16px; line-height: 1.35; box-shadow: none;
}
.sf .sf-input::placeholder { color: var(--muted); opacity: .85; }
.sf .sf-input:focus { border-color: var(--sf-brand-tx); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--sf-brand) 22%, transparent); }
.sf .sf-input[aria-invalid="true"] { border-color: var(--out); }
.sf .sf-input[readonly] { background: var(--bg); }
.sf textarea.sf-input { resize: vertical; min-height: 64px; }
.sf .sf-q { padding-left: 42px; border-radius: 999px; min-height: 44px; }
.sf .sf-q::-webkit-search-cancel-button { cursor: pointer; }
.sf .sf-chips {
  display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
  margin: -4px calc(-1 * var(--sf-gr)) 0 calc(-1 * var(--sf-gl)); padding: 4px var(--sf-gr) 10px var(--sf-gl);
  scroll-padding-inline: var(--sf-gl);
}
.sf .sf-chips::-webkit-scrollbar { display: none; }
.sf .sf-tools-in > .sf-search:last-child { margin-bottom: 10px; }
.sf .sf-chip {
  appearance: none; flex: none; min-height: 36px; padding: 7px 15px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: .86rem; font-weight: 600; white-space: nowrap;
}
.sf .sf-chip:hover { border-color: var(--ink); }
.sf .sf-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
@media (min-width: 760px) {
  .sf .sf-tools-in { grid-template-columns: minmax(240px, 340px) minmax(0, 1fr); align-items: center; gap: 16px; padding-top: 12px; padding-bottom: 12px; }
  .sf .sf-chips { margin: -4px; padding: 4px; scroll-padding-inline: 4px; }
  .sf .sf-tools-in > .sf-search:last-child { margin-bottom: 0; }
}

/* ---------- grilla de productos ---------- */
.sf .sf-main { max-width: var(--sf-max); margin: 0 auto; padding: 16px var(--sf-gr) 48px var(--sf-gl); }
.sf .sf-bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; min-height: 20px; }
.sf .sf-count { font-size: .76rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sf .sf-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 12px; }
@media (min-width: 700px) { .sf .sf-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px 18px; } }
@media (min-width: 1020px) { .sf .sf-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px 22px; } }
.sf .sf-card { display: flex; flex-direction: column; min-width: 0; }
.sf .sf-card-hit {
  appearance: none; border: 0; background: none; padding: 0; margin: 0; color: inherit; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-width: 0; border-radius: var(--sf-r);
}
.sf .sf-ph {
  position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; border-radius: var(--sf-r);
  background: var(--sf-soft); isolation: isolate;
}
.sf .sf-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; z-index: 1; transition: transform .45s ease, filter .2s; }
.sf .sf-ph-l {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: clamp(2.6rem, 13vw, 4.4rem); line-height: 1;
  color: color-mix(in srgb, var(--sf-brand-tx) 70%, var(--sf-soft));
  background: radial-gradient(circle at 50% 50%, transparent 0 38%, color-mix(in srgb, var(--sf-brand) 7%, transparent) 38% 39%, transparent 39%), var(--sf-soft);
}
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .sf .sf-card-hit:hover .sf-img { transform: scale(1.035); }
}
.sf .sf-badge {
  position: absolute; z-index: 2; top: 10px; left: 10px; padding: 3px 9px; border-radius: 999px;
  background: var(--sf-brand); color: var(--sf-brand-ink); font-size: .74rem; font-weight: 750; font-variant-numeric: tabular-nums;
}
.sf .sf-flag {
  position: absolute; z-index: 2; left: 10px; bottom: 10px; max-width: calc(100% - 20px);
  padding: 3px 9px; border-radius: 999px; font-size: .72rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sf .sf-flag-warn { background: var(--warn-soft); color: color-mix(in srgb, var(--warn) 76%, var(--ink)); }
.sf .sf-flag-out { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.sf .sf-is-out .sf-img { filter: grayscale(.9) contrast(.85); }
.sf .sf-is-out .sf-ph-l { filter: grayscale(.9); opacity: .55; }
.sf .sf-is-out.sf-d-ph::after, .sf .sf-is-out .sf-ph::after { content: ""; position: absolute; inset: 0; z-index: 1; background: color-mix(in srgb, var(--surface) 42%, transparent); pointer-events: none; }
.sf .sf-card.sf-is-out .sf-name, .sf .sf-card.sf-is-out .sf-price b { color: var(--muted); }
.sf .sf-card-bd { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 0 2px; }
.sf .sf-kicker {
  display: block; font-size: .68rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sf .sf-name {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  font-weight: 600; font-size: .96rem; line-height: 1.25; overflow-wrap: anywhere;
}
.sf .sf-pres { display: block; color: var(--muted); font-size: .8rem; }
.sf .sf-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; margin-top: 6px; }
.sf .sf-price b { font-weight: 750; font-size: 1.02rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sf .sf-price s { color: var(--muted); font-size: .8rem; white-space: nowrap; }
.sf .sf-price.sf-is-sale b { color: var(--sf-brand-tx); }
.sf .sf-usd { display: block; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sf .sf-add {
  appearance: none; margin-top: 12px; min-height: 40px; padding: 8px 12px; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font-weight: 650; font-size: .88rem;
  transition: background-color .15s, color .15s, border-color .15s;
}
.sf .sf-add .sf-ic { width: 16px; height: 16px; }
.sf .sf-add:hover { background: var(--ink); color: var(--bg); }
.sf .sf-add.sf-is-done, .sf .sf-add.sf-is-done:hover { background: var(--sf-brand); color: var(--sf-brand-ink); border-color: var(--sf-brand); }
.sf .sf-add:disabled, .sf .sf-add:disabled:hover { border-color: var(--line); background: transparent; color: var(--muted); cursor: not-allowed; }
.sf .sf-empty { grid-column: 1 / -1; padding: 48px 12px; text-align: center; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; justify-items: center; }
.sf .sf-empty-t { font-family: var(--display); font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }
.sf .sf-empty-p { color: var(--muted); max-width: 36ch; }
.sf .sf-empty .sf-btn { margin-top: 8px; }

/* ---------- pie ---------- */
.sf .sf-foot { background: var(--surface); border-top: 1px solid var(--line); padding: 32px var(--sf-gr) calc(112px + var(--sf-safe-b)) var(--sf-gl); }
.sf .sf-foot-in { max-width: var(--sf-max); margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; }
.sf .sf-foot-a { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; justify-items: start; align-content: start; }
.sf .sf-foot-name { font-family: var(--display); font-weight: 800; font-size: 1.3rem; letter-spacing: -.015em; }
.sf .sf-foot-msg { color: var(--muted); max-width: 42ch; }
.sf .sf-dl { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.sf .sf-dl dt { font-size: .7rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; color: var(--muted); }
.sf .sf-dl dd { margin-top: 3px; user-select: text; -webkit-user-select: text; overflow-wrap: anywhere; }
.sf .sf-foot-fine { max-width: var(--sf-max); margin: 28px auto 0; padding-top: 16px; border-top: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
@media (min-width: 640px) { .sf .sf-dl { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; } }
@media (min-width: 900px) { .sf .sf-foot-in { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 40px; } }

/* ---------- carrito flotante y aviso ---------- */
.sf .sf-fab {
  position: fixed; z-index: 50; left: 50%; translate: -50% 0; bottom: calc(14px + var(--sf-safe-b));
  width: min(440px, calc(100% - 32px)); min-height: 58px; padding: 9px 20px 9px 10px; border: 0; border-radius: 999px; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--bg); box-shadow: 0 12px 32px rgb(0 0 0 / .28), 0 2px 6px rgb(0 0 0 / .18);

          : '<button type="button" class="sf-add" data-act="add" data-c="' + esc(c) + '" aria-label="Agregar ' + esc(itemLabel(p)) + ' al carrito">' + IC.plus + '<span>Agregar</span></button>') +

    }
    function headerHTML() {
      var tags = [];
      if (hasRet) tags.push('<span class="sf-tag">' + IC.store + 'Retiro en tienda</span>');
      if (hasDel) {
        var min = zonas.length ? Math.min.apply(null, zonas.map(function (z) { return num(z.costo); })) : -1;
        tags.push('<span class="sf-tag">' + IC.truck + 'Delivery' + (min > 0 ? ' desde ' + esc(money(min)) : '') + '</span>');
        if (gratisDesde > 0) tags.push('<span class="sf-tag sf-tag-soft">Envío gratis desde ' + esc(money(gratisDesde)) + esc(freeWhere) + '</span>');
      }
      return '<header class="sf-head"><div class="sf-head-in">' +
        (logo && logo.icono
          ? '<span class="sf-mark sf-mark-img" aria-hidden="true"><img src="' + esc(logo.icono) + '" alt=""></span>'
          : '<span class="sf-mark" aria-hidden="true">' + esc(firstChar(store.nombre) || 'T') + '</span>') +
        '<div class="sf-head-txt">' +
          '<p class="sf-eyebrow">' + IC.chat + 'Pedidos por WhatsApp</p>' +
          (logo && logo.letras
            ? '<h1 class="sf-title sf-title-wm"><span class="sf-sr">' + esc(store.nombre || 'Nuestra tienda') + '</span>' +
              '<span class="sf-wm" aria-hidden="true" style="--sf-wm-r:' + logo.ratio + ';-webkit-mask-image:url(' + logo.letras + ');mask-image:url(' + logo.letras + ')"></span></h1>'
            : '<h1 class="sf-title">' + esc(store.nombre || 'Nuestra tienda') + '</h1>') +

    function toolsHTML() {
      return '<div class="sf-tools"><div class="sf-tools-in">' +
        '<div class="sf-search">' + IC.search +
          '<label class="sf-sr" for="sf-q">Buscar productos</label>' +
          '<input id="sf-q" class="sf-input sf-q" type="search" placeholder="Busca un producto o una marca" autocomplete="off" enterkeyhint="search">' +
        '</div>' +
        (cats.length > 1 ? '<div class="sf-chips" id="sf-chips" role="group" aria-label="Categorías"></div>' : '') +
      '</div></div>';
    }
    function chipsHTML() {
      return ['<button type="button" class="sf-chip" data-act="cat" data-v="" aria-pressed="' + (S.cat === '') + '">Todo</button>']
        .concat(cats.map(function (c) {
          return '<button type="button" class="sf-chip" data-act="cat" data-v="' + esc(c) + '" aria-pressed="' + (S.cat === c) + '">' + esc(c) + '</button>';
        })).join('');
    }
    function fmtDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      try { return new Intl.DateTimeFormat('es-NI', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'America/Managua' }).format(d); }
      catch (e) { try { return new Intl.DateTimeFormat('es', { day: 'numeric', month: 'long', year: 'numeric' }).format(d); } catch (e2) { return d.toISOString().slice(0, 10); } }
    }
    function footHTML() {
      var rows = [];
      if (store.direccion) rows.push('<div><dt>Dirección</dt><dd>' + esc(store.direccion) + '</dd></div>');
      if (store.horario) rows.push('<div><dt>Horario</dt><dd>' + esc(store.horario) + '</dd></div>');
      if (store.telefono || wa) rows.push('<div><dt>Teléfono</dt><dd class="sf-num">' + esc(store.telefono || ('+' + wa)) + '</dd></div>');
      var date = fmtDate(data.publicado);
      return '<footer class="sf-foot"><div class="sf-foot-in">' +
        '<div class="sf-foot-a">' +
          '<p class="sf-foot-name">' + esc(store.nombre || '') + '</p>' +
          (store.mensaje ? '<p class="sf-foot-msg">' + esc(store.mensaje) + '</p>' : '') +
          (wa ? '<a class="sf-btn sf-btn-line sf-btn-sm" href="https://wa.me/' + esc(wa) + '" target="_blank" rel="noopener">' + IC.chat + 'Escríbenos por WhatsApp</a>' : '') +
        '</div>' +
        (rows.length ? '<dl class="sf-dl">' + rows.join('') + '</dl>' : '') +
      '</div>' +
      '<p class="sf-foot-fine">Precios en córdobas' + (date ? ' · Actualizado el ' + esc(date) : '') + '</p>' +
      '</footer>';
    }

    /* ---------- render principal ---------- */
    rootEl.innerHTML =
      '<div class="sf-page">' + pvHTML + headerHTML() + toolsHTML() +
        '<div class="sf-main"><div class="sf-bar"><p class="sf-count" id="sf-count"></p></div>' +
        '<ul class="sf-grid" id="sf-grid" role="list"></ul></div>' +
        footHTML() +
        '<button type="button" class="sf-fab" id="sf-fab" data-act="cart" hidden>' +
          '<span class="sf-fab-ic">' + IC.bag + '<span class="sf-fab-n" id="sf-fab-n">0</span></span>' +
          '<span class="sf-fab-t">Ver carrito</span><span class="sf-fab-sum sf-num" id="sf-fab-sum"></span>' +
        '</button>' +
      '</div>' +
      '<div class="sf-layer" hidden><div class="sf-scrim" data-act="close"></div>' +
        '<div class="sf-sheet" role="dialog" aria-modal="true" aria-labelledby="sf-sheet-title" tabindex="-1"></div></div>' +
      '<div class="sf-toast" id="sf-toast" role="status" aria-live="polite"></div>' +
      '<p class="sf-sr" id="sf-live" aria-live="polite"></p>';

    page = rootEl.querySelector('.sf-page');
    grid = rootEl.querySelector('#sf-grid');
    countEl = rootEl.querySelector('#sf-count');
    qInput = rootEl.querySelector('#sf-q');
    chipsEl = rootEl.querySelector('#sf-chips');
    fab = rootEl.querySelector('#sf-fab');
    toastEl = rootEl.querySelector('#sf-toast');
    layer = rootEl.querySelector('.sf-layer');
    sheet = rootEl.querySelector('.sf-sheet');

    function visibleProducts() {
      var words = norm(S.q).trim().split(/\s+/).filter(Boolean);
      return sorted.filter(function (p) {
        if (S.cat && String(p.categoria || '') !== S.cat) return false;
        var h = hay[String(p.c)];
        return words.every(function (w) { return h.indexOf(w) !== -1; });
      });
    }
    function renderChips() { if (chipsEl) chipsEl.innerHTML = chipsHTML(); }
    /* Las tarjetas se dibujan una sola vez; buscar y filtrar solo ocultan o muestran cada <li>. */
    var cardEls = null, emptyEl = null;
    function renderGrid() {
      if (!products.length) {
        countEl.textContent = '';
        grid.innerHTML = '<li class="sf-empty"><p class="sf-empty-t">Todavía no hay productos publicados</p>' +
          '<p class="sf-empty-p">Vuelve pronto o escríbenos para preguntar por lo que buscas.</p></li>';
        return;
      }
      if (!cardEls) {
        grid.innerHTML = sorted.map(cardHTML).join('') + '<li class="sf-empty" hidden></li>';
        cardEls = Array.prototype.slice.call(grid.children, 0, sorted.length);
        emptyEl = grid.lastElementChild;
      }
      var list = visibleProducts(), vis = {};
      list.forEach(function (p) { vis[String(p.c)] = 1; });
      sorted.forEach(function (p, i) {
        var hide = !vis[String(p.c)];
        if (cardEls[i].hidden !== hide) cardEls[i].hidden = hide;
      });
      var filtered = S.q.trim() || S.cat;
      countEl.textContent = (S.cat ? S.cat + ' · ' : '') + list.length + (list.length === 1 ? ' producto' : ' productos');
      if (!list.length) {
        emptyEl.innerHTML = '<p class="sf-empty-t">No encontramos ' + (S.q.trim() ? '“' + esc(S.q.trim()) + '”' : 'productos aquí') + '</p>' +
          '<p class="sf-empty-p">Prueba con otra palabra o revisa todo el catálogo.</p>' +
          (filtered ? '<button type="button" class="sf-btn sf-btn-line sf-btn-sm" data-act="reset">Ver todo el catálogo</button>' : '');
        emptyEl.hidden = false;
      } else if (!emptyEl.hidden) {
        emptyEl.hidden = true;
        emptyEl.innerHTML = '';
      }
    }
    function updateFab(bump) {
      var t = cartTotals();
      fab.hidden = t.count === 0;
      rootEl.querySelector('#sf-fab-n').textContent = String(t.count);
      rootEl.querySelector('#sf-fab-sum').textContent = money(t.subtotal);
      fab.setAttribute('aria-label', 'Ver carrito: ' + t.count + (t.count === 1 ? ' producto, ' : ' productos, ') + money(t.subtotal));
      if (bump && !fab.hidden) {
        fab.classList.remove('sf-is-bump');
        void fab.offsetWidth;
        fab.classList.add('sf-is-bump');
      }
    }
    var toastTimer = null;
    function hideToast() {
      toastEl.classList.remove('sf-is-on');
      if (toastTimer) { win.clearTimeout(toastTimer); timers.splice(timers.indexOf(toastTimer), 1); toastTimer = null; }
    }
    function announce(msg) {
      var el = rootEl.querySelector('#sf-live');
      if (!el) return;
      el.textContent = '';
      later(function () { el.textContent = msg; }, 30);
    }
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('sf-is-on');
      if (toastTimer) { win.clearTimeout(toastTimer); timers.splice(timers.indexOf(toastTimer), 1); }
      toastTimer = later(function () { toastEl.classList.remove('sf-is-on'); toastTimer = null; }, 2400);
    }
    function flashAdded(btn) {
      if (!btn || !btn.isConnected) return;
      btn.classList.add('sf-is-done');
      btn.innerHTML = IC.check + '<span>Agregado</span>';
      later(function () {
        if (!btn.isConnected) return;
        btn.classList.remove('sf-is-done');
        btn.innerHTML = IC.plus + '<span>Agregar</span>';
      }, 1400);
    }

    /* ---------- hojas (diálogos) ---------- */
    function isShown(el) { return !!(el && el.isConnected && el.getClientRects().length); }
    function focusEl(el) { if (!el) return; try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
    function lockScroll() {
      var h = doc.documentElement, b = doc.body;
      lockSaved = { h: h.style.overflow, b: b ? b.style.overflow : '' };
      h.style.overflow = 'hidden';
      if (b) b.style.overflow = 'hidden';
    }
    function unlockScroll() {
      if (!lockSaved) return;
      doc.documentElement.style.overflow = lockSaved.h;
      if (doc.body) doc.body.style.overflow = lockSaved.b;
      lockSaved = null;
    }
    function openSheet(kind, from, arg) {
      if (!S.sheet) {
        hideToast();
        S.ret = from || doc.activeElement;
        lockScroll();
        layer.hidden = false;
        page.inert = true;
        page.setAttribute('aria-hidden', 'true');
        doc.addEventListener('keydown', onKey, true);
      }
      if (kind === 'detail') S.detail = { c: arg.c, q: 1, added: false };
      S.sheet = kind;
      renderSheet(true);
    }
    function closeSheet() {
      if (!S.sheet) return;
      hideToast();
      S.sheet = null;
      S.detail = null;
      layer.hidden = true;
      sheet.innerHTML = '';
      sheet.removeAttribute('data-kind');
      page.inert = false;
      page.removeAttribute('aria-hidden');
      unlockScroll();
      doc.removeEventListener('keydown', onKey, true);
      var r = S.ret;
      S.ret = null;
      if (!isShown(r)) r = isShown(fab) ? fab : qInput;
      focusEl(r);
    }
    function focusTitle() { focusEl(sheet.querySelector('#sf-sheet-title') || sheet); }
    function renderSheet(moveFocus) {
      var k = S.sheet;
      sheet.setAttribute('data-kind', k);
      sheet.innerHTML = k === 'detail' ? detailHTML() : k === 'cart' ? cartHTML() : k === 'checkout' ? checkoutHTML() : doneHTML();
      if (k === 'checkout') initCheckout();
      if (moveFocus) { sheet.scrollTop = 0; var b = sheet.querySelector('.sf-d-body'); if (b) b.scrollTop = 0; focusTitle(); }
    }
    function rerenderKeepFocus() {
      var a = doc.activeElement, key = null;
      if (a && sheet.contains(a) && a.getAttribute('data-act')) key = [a.getAttribute('data-act'), a.getAttribute('data-c') || '', a.getAttribute('data-d') || ''];
      var st = sheet.scrollTop;
      renderSheet(false);
      sheet.scrollTop = st;
      if (!key) return;
      var all = Array.prototype.slice.call(sheet.querySelectorAll('[data-act]'));
      var same = all.filter(function (el) { return el.getAttribute('data-act') === key[0] && (el.getAttribute('data-c') || '') === key[1] && (el.getAttribute('data-d') || '') === key[2]; })[0];
      if (same && !same.disabled) return focusEl(same);
      var sib = all.filter(function (el) { return el.getAttribute('data-act') === key[0] && (el.getAttribute('data-c') || '') === key[1] && !el.disabled; })[0];
      if (sib) return focusEl(sib);
      focusTitle();
    }
    function focusables() {
      return Array.prototype.slice.call(sheet.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'))
        .filter(function (el) { return el.getClientRects().length && !(el.type === 'radio' && !el.checked && sheet.querySelector('input[type="radio"][name="' + el.name + '"]:checked')); });
    }
    function onKey(e) {
      if (!S.sheet) return;
      if (e.key === 'Escape' || e.key === 'Esc') { e.preventDefault(); closeSheet(); return; }
      if (e.key !== 'Tab') return;
      var f = focusables();
      if (!f.length) { e.preventDefault(); focusEl(sheet); return; }
      var first = f[0], last = f[f.length - 1], a = doc.activeElement;
      if (!sheet.contains(a)) { e.preventDefault(); focusEl(e.shiftKey ? last : first); }
      else if (e.shiftKey && (a === first || a === sheet || a.id === 'sf-sheet-title')) { e.preventDefault(); focusEl(last); }
      else if (!e.shiftKey && a === last) { e.preventDefault(); focusEl(first); }
    }
    function headHTML(title, back) {
      return '<div class="sf-sh-head">' +
        (back ? '<button type="button" class="sf-icon-btn" data-act="' + back[0] + '" aria-label="' + esc(back[1]) + '">' + IC.back + '</button>' : '') +
        '<h2 class="sf-sh-title" id="sf-sheet-title" tabindex="-1">' + title + '</h2>' +
        '<button type="button" class="sf-icon-btn" data-act="close" aria-label="Cerrar">' + IC.close + '</button></div>';
    }

    /* ---------- detalle ---------- */
    function detailHTML() {
      var p = byCode[S.detail.c];
      var out = isOut(p);
      var label = itemLabel(p);
      var link = productLink(p);
      var shareText = label + ' · ' + money(p.precio) + '\n' + link;
      var meta = [p.presentacion, p.categoria].filter(Boolean).map(esc).join(' · ');
      return '<div class="sf-sh-head sf-sh-float"><button type="button" class="sf-icon-btn sf-icon-raised" data-act="close" aria-label="Cerrar">' + IC.close + '</button></div>' +
        '<div class="sf-d-ph' + (out ? ' sf-is-out' : '') + '">' + photoHTML(p, true) + flagsHTML(p) + '</div>' +
        '<div class="sf-d-body">' +
          (p.marca ? '<p class="sf-kicker">' + esc(p.marca) + '</p>' : '') +
          '<h2 class="sf-d-name" id="sf-sheet-title" tabindex="-1">' + esc(p.nombre || p.marca) + '</h2>' +
          (meta ? '<p class="sf-d-meta">' + meta + '</p>' : '') +
          '<div class="sf-d-price">' + priceHTML(p, 'sf-price sf-price-lg') + '</div>' +
          (out ? '<p class="sf-note sf-note-out">Este producto está agotado por ahora.' +
            (wa ? ' <a class="sf-a" href="' + esc(waHref('Hola, ¿cuándo vuelve ' + label + '?')) + '" target="_blank" rel="noopener">Pregunta cuándo vuelve</a>' : '') + '</p>' : '') +
          (p.descripcion ? '<p class="sf-d-desc">' + esc(p.descripcion) + '</p>' : '') +
          '<div class="sf-share">' +
            '<button type="button" class="sf-btn sf-btn-line sf-btn-sm" data-act="share">' + IC.link + 'Compartir</button>' +
            '<a class="sf-btn sf-btn-line sf-btn-sm" href="https://wa.me/?text=' + esc(encodeURIComponent(shareText)) + '" target="_blank" rel="noopener">' + IC.chat + 'Enviar por WhatsApp</a>' +
          '</div>' +
          '<div class="sf-field sf-share-fb" hidden><label for="sf-share-link">Enlace del producto</label>' +
            '<input id="sf-share-link" class="sf-input" readonly value="' + esc(link) + '"></div>' +
        '</div>' +
        '<div class="sf-sh-foot sf-d-foot" id="sf-d-foot">' + detailFootHTML(p) + '</div>';
    }
    function detailFootHTML(p) {
      var out = isOut(p), d = S.detail;
      if (d.added) {
        var t = cartTotals();
        return '<p class="sf-added">' + IC.check + '<span>Listo, está en tu carrito.</span></p>' +
          '<div class="sf-row2"><button type="button" class="sf-btn sf-btn-line" data-act="close">Seguir viendo</button>' +
          '<button type="button" class="sf-btn sf-btn-pri" data-act="tocart" id="sf-d-gocart">Ver carrito (' + t.count + ')</button></div>';
      }
      return (d.q > 1 && !out ? '<p class="sf-d-sum sf-num">' + d.q + ' × ' + esc(money(p.precio)) + ' = <b>' + moneyHTML(num(p.precio) * d.q) + '</b></p>' : '') +
        '<div class="sf-d-act">' + stepperHTML(d.q, 'dqty', '', out) +
        '<button type="button" class="sf-btn sf-btn-pri sf-grow" data-act="dadd"' + (out ? ' disabled' : '') + '>' +
        (out ? 'Agotado' : 'Agregar al carrito') + '</button></div>';
    }
    /* En el límite (1 o MAX_Q) el botón queda aria-disabled, no disabled: conserva el foco y
       una pulsación repetida no salta al botón contrario. disabled solo cuando todo el control está inactivo. */
    function stepperHTML(q, act, c, disabled, small) {
      var name = c ? itemLabel(byCode[c]) : '';
      function btn(d, label, icon, atLimit) {
        return '<button type="button" data-act="' + act + '" data-c="' + esc(c) + '" data-d="' + d + '" aria-label="' + label + '"' +
          (disabled ? ' disabled' : atLimit ? ' aria-disabled="true"' : '') + '>' + icon + '</button>';
      }
      return '<div class="sf-step' + (small ? ' sf-step-sm' : '') + '" role="group" aria-label="Cantidad' + (name ? ' de ' + esc(name) : '') + '">' +
        btn(-1, 'Quitar uno', IC.minus, q <= 1) +
        '<span class="sf-step-v sf-num" aria-live="polite">' + q + '</span>' +
        btn(1, 'Agregar uno', IC.plus, q >= MAX_Q) + '</div>';
    }
    function refreshDetailFoot(focusSel) {
      var foot = sheet.querySelector('#sf-d-foot');
      if (!foot || !S.detail) return;
      var a = doc.activeElement, d = a && foot.contains(a) ? a.getAttribute('data-d') : null;
      foot.innerHTML = detailFootHTML(byCode[S.detail.c]);
      var target = focusSel ? foot.querySelector(focusSel) : d ? foot.querySelector('[data-d="' + d + '"]') : null;
      if (target && target.disabled) target = foot.querySelector('[data-act="dqty"]:not([disabled])');
      if (target) focusEl(target);
    }

    /* ---------- carrito ---------- */
    function freeHint(subtotal, zona) {
      if (!hasDel || gratisDesde <= 0) return '';
      var head = '<b>Envío gratis desde ' + moneyHTML(gratisDesde) + esc(freeWhere) + '.</b> ';
      if (zona && !freeZone(zona)) return '<p class="sf-hint">' + IC.truck + '<span>' + head + 'No aplica para la entrega en ' + esc(oneLine(zona.nombre)) + '.</span></p>';
      if (subtotal >= gratisDesde) return '<p class="sf-hint sf-is-ok">' + IC.check + '<span>' + head + 'Tu pedido ya califica.</span></p>';
      return '<p class="sf-hint">' + IC.truck + '<span>' + head + 'Te faltan ' + moneyHTML(gratisDesde - subtotal) + '.</span></p>';
    }
    function cartHTML() {
      var t = cartTotals();
      if (!t.lines.length) {
        return headHTML('Tu carrito') +
          '<div class="sf-sh-body sf-cart-empty"><span class="sf-blank-ic">' + IC.bag + '</span><p class="sf-empty-t">Tu carrito está vacío</p>' +
          '<p class="sf-empty-p">Agrega productos desde el catálogo.</p>' +
          '<button type="button" class="sf-btn sf-btn-pri" data-act="close">Ver productos</button></div>';
      }
      return headHTML('Tu carrito <span class="sf-muted sf-num">(' + t.count + ')</span>') +
        '<div class="sf-sh-body"><ul class="sf-lines" role="list">' + t.lines.map(function (l) {
          return '<li class="sf-line">' +
            '<span class="sf-ph sf-line-ph">' + photoHTML(l.p, false) + '</span>' +
            '<div class="sf-line-main">' +
              '<p class="sf-line-name">' + esc(l.p.nombre || l.p.marca) + (l.p.presentacion ? ' <span class="sf-muted">' + esc(l.p.presentacion) + '</span>' : '') + '</p>' +
              '<p class="sf-line-unit sf-num">' + esc(money(l.precio)) + ' c/u</p>' +
              '<div class="sf-line-ctl">' + stepperHTML(l.q, 'qty', l.c, false, true) +
                '<button type="button" class="sf-linkbtn" data-act="rm" data-c="' + esc(l.c) + '" aria-label="Quitar ' + esc(l.label) + ' del carrito">Quitar</button></div>' +
            '</div>' +
            '<p class="sf-line-total sf-num">' + esc(money(l.total)) + '</p>' +
          '</li>';
        }).join('') + '</ul>' + freeHint(t.subtotal) + '</div>' +
        '<div class="sf-sh-foot">' +
          '<div class="sf-sum-row sf-sum-total"><span>Subtotal</span><b class="sf-num">' + esc(money(t.subtotal)) + '</b></div>' +
          (showUSD ? '<p class="sf-usd sf-right">' + esc(priceUSD(t.subtotal)) + '</p>' : '') +
          '<p class="sf-fine">La entrega y el pago los eliges en el siguiente paso.</p>' +
          '<button type="button" class="sf-btn sf-btn-pri" data-act="checkout">Continuar</button>' +
        '</div>';
    }
    function changeQty(c, d) {
      var it = inCart(c);
      if (!it) return;
      it.q = Math.max(1, Math.min(MAX_Q, it.q + d));
      saveCart();
      updateFab(false);
      rerenderKeepFocus();
    }
    function removeItem(c) {
      S.cart = S.cart.filter(function (x) { return x.c !== c; });
      saveCart();
      updateFab(false);
      rerenderKeepFocus();
      if (!S.cart.length) focusTitle();
      var p = byCode[c];
      if (p) announce('Quitaste ' + itemLabel(p) + ' del carrito.');

    /* ---------- checkout ---------- */

    function initCheckout() {
      if (!S.code) S.code = newCode();
      var f = sheet.querySelector('#sf-co-form');
      f.addEventListener('input', updateCheckout);
      f.addEventListener('change', updateCheckout);
      f.addEventListener('submit', function (e) { e.preventDefault(); });
      S.lastPago = null;
      updateCheckout();
    }
    function $s(id) { return sheet.querySelector('#' + id); }
    function readCheckout() {
      var v = function (id) { var el = $s(id); return el ? el.value : null; };
      if ($s('sf-co-nombre')) S.co.nombre = v('sf-co-nombre');
      if ($s('sf-co-tel')) S.co.telefono = v('sf-co-tel');
      var e = sheet.querySelector('input[name="sf-entrega"]:checked');
      if (e) S.co.entrega = e.value;
      if ($s('sf-co-zona')) S.co.zona = v('sf-co-zona');
      if ($s('sf-co-dir')) S.co.direccion = v('sf-co-dir');
      var pg = sheet.querySelector('input[name="sf-pago"]:checked');
      if (pg) S.co.pago = pg.value;
      if ($s('sf-co-nota')) S.co.nota = v('sf-co-nota');
    }
    function checkoutObj() {
      return { code: S.code, nombre: S.co.nombre, telefono: S.co.telefono, entrega: S.co.entrega || '', zona: S.co.zona,
        direccion: S.co.direccion, pago: pagos.length ? S.co.pago : '', nota: S.co.nota };
    }
    function acctNumber(text) {
      var m = String(text || '').match(/\d[\d\s.-]{4,}\d/g) || [];
      for (var i = 0; i < m.length; i++) { var d = m[i].replace(/[^\d]/g, ''); if (d.length >= 6) return d; }
      return '';
    }
    function updateCheckout() {
      if (S.sheet !== 'checkout') return;
      readCheckout();
      saveClient();
      Array.prototype.forEach.call(sheet.querySelectorAll('.sf-rc'), function (l) {
        var i = l.querySelector('input'); l.classList.toggle('sf-is-on', !!(i && i.checked));
      });
      var rb = $s('sf-co-retiro-box'), db = $s('sf-co-del-box');
      if (rb) rb.hidden = S.co.entrega !== 'retiro';
      if (db) db.hidden = S.co.entrega !== 'delivery';
      if (S.co.pago !== S.lastPago) {
        S.lastPago = S.co.pago;
        var pb = $s('sf-co-pago-box');
        var pm = findPago(store, S.co.pago);
        if (pb) {
          if (pm && pm.detalle) {
            var acct = acctNumber(pm.detalle);
            pb.innerHTML = '<p id="sf-co-pago-det">' + esc(pm.detalle) + '</p>' +
              (acct ? '<button type="button" class="sf-btn sf-btn-line sf-btn-sm" data-act="copyacct" data-v="' + esc(acct) + '">' + IC.copy + 'Copiar número de cuenta</button>' : '');
            pb.hidden = false;
          } else { pb.innerHTML = ''; pb.hidden = true; }
        }
      }
      var t = cartTotals();
      var co = checkoutObj();
      var ship = shipping(store, co, t.subtotal);
      $s('sf-co-sub').textContent = money(t.subtotal);
      var shipTxt;
      if (!co.entrega) shipTxt = 'Elige una opción';
      else if (ship.kind === 'retiro') shipTxt = 'Retiro en tienda · Gratis';
      else if (ship.gratis) shipTxt = 'Gratis';
      else if (ship.zona) shipTxt = money(ship.costo);
      else shipTxt = zonas.length ? 'Elige tu zona' : 'Por confirmar';
      $s('sf-co-ship').textContent = shipTxt;
      $s('sf-co-total').textContent = money(t.subtotal + ship.costo);
      $s('sf-co-total2').textContent = money(t.subtotal + ship.costo) + (co.entrega === 'delivery' && !ship.zona && !ship.gratis ? ' + entrega' : '');
      var ue = $s('sf-co-usd'); if (ue) ue.textContent = priceUSD(t.subtotal + ship.costo);
      var fr = $s('sf-co-free'); if (fr) fr.innerHTML = freeHint(t.subtotal, ship.zona);
      var a = $s('sf-co-send');
      var text = orderText(vstore, S.cart, co);
      if (a && wa) a.setAttribute('href', waHref(text));
      var cf = $s('sf-co-copy');
      if (cf && !cf.closest('[hidden]')) cf.value = text;
      if (S.tried) showErrors(validate());
    }
    function validate() {
      var co = S.co, errs = [];
      if (oneLine(co.nombre).length < 2) errs.push({ f: 'sf-co-nombre', m: 'Escribe tu nombre.' });
      if (digits(co.telefono).length < 8) errs.push({ f: 'sf-co-tel', m: 'Escribe tu número de WhatsApp (mínimo 8 dígitos).' });
      if (!co.entrega) {
        errs.push({ f: hasRet ? 'sf-co-ent-retiro' : 'sf-co-ent-delivery', e: 'sf-co-ent-err', m: 'Elige cómo quieres recibir tu pedido.' });
      } else if (co.entrega === 'delivery') {
        if (zonas.length && !findZone(store, co.zona)) errs.push({ f: 'sf-co-zona', m: 'Elige tu zona de entrega.' });
        if (oneLine(co.direccion).length < 6) errs.push({ f: 'sf-co-dir', m: 'Escribe tu dirección y un punto de referencia.' });
      }
      if (pagos.length && !findPago(store, co.pago)) {
        var first = sheet.querySelector('input[name="sf-pago"]');
        errs.push({ f: first ? first.id : '', e: 'sf-co-pago-err', m: 'Elige cómo vas a pagar.' });
      }
      return errs;
    }
    function showErrors(errs) {
      Array.prototype.forEach.call(sheet.querySelectorAll('.sf-co .sf-err'), function (p) { p.hidden = true; p.textContent = ''; });
      Array.prototype.forEach.call(sheet.querySelectorAll('.sf-co [aria-invalid]'), function (el) { el.removeAttribute('aria-invalid'); });
      errs.forEach(function (er) {
        var p = $s(er.e || er.f + '-err');
        if (p) { p.textContent = er.m; p.hidden = false; }
        if (!er.e) { var el = $s(er.f); if (el) el.setAttribute('aria-invalid', 'true'); }
      });
      var fe = $s('sf-co-formerr');
      if (fe) fe.hidden = !errs.length;
    }
    function focusField(id) {
      var el = id ? $s(id) : null;
      if (!el) return;
      focusEl(el);
      var box = el.closest('.sf-field') || el.closest('.sf-sec') || el;
      try { box.scrollIntoView({ block: 'center', behavior: 'auto' }); } catch (e) { box.scrollIntoView(); }
    }
    function checkValid() {
      readCheckout();
      var errs = validate();
      if (errs.length) {
        S.tried = true;
        showErrors(errs);
        focusField(errs[0].f);
        return false;
      }
      return true;
    }
    function onSend(e, a) {
      if (!wa) { e.preventDefault(); toast('Esta tienda todavía no tiene WhatsApp configurado.'); return; }
      if (!checkValid()) { e.preventDefault(); return; }
      var text = orderText(vstore, S.cart, checkoutObj());
      a.setAttribute('href', waHref(text));
      S.doneText = text;
      later(function () { if (S.sheet === 'checkout') { S.sheet = 'done'; renderSheet(true); } }, 0);
    }

    /* ---------- confirmación ---------- */
    function doneHTML() {
      return headHTML('Pedido #' + esc(S.code)) +
        '<div class="sf-sh-body sf-done">' +
          '<span class="sf-done-ic">' + IC.check + '</span>' +
          '<p class="sf-done-lead">Tu pedido <b>#' + esc(S.code) + '</b> se abrió en WhatsApp. Envía el mensaje para confirmarlo.</p>' +
          '<p class="sf-fine">¿No se abrió WhatsApp? Copia el mensaje y envíalo al ' +
            '<a class="sf-a" href="https://wa.me/' + esc(wa) + '" target="_blank" rel="noopener">' + esc(store.telefono || '+' + wa) + '</a>.</p>' +
          '<pre class="sf-msg" id="sf-done-msg" tabindex="0" aria-label="Mensaje del pedido">' + esc(S.doneText) + '</pre>' +
          '<button type="button" class="sf-btn sf-btn-line sf-btn-sm" data-act="copydone">' + IC.copy + 'Copiar mensaje</button>' +
        '</div>' +
        '<div class="sf-sh-foot">' +
          '<button type="button" class="sf-btn sf-btn-pri" data-act="clear">Vaciar carrito y seguir comprando</button>' +
          '<button type="button" class="sf-btn sf-btn-ghost" data-act="backco">Volver al pedido</button>' +
        '</div>';
    }

    /* ---------- copiar ---------- */
    function legacyCopy(text) {
      var ta = doc.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.setAttribute('aria-hidden', 'true');
      ta.className = 'sf-offscreen';
      var host = S.sheet ? sheet : rootEl;
      var prev = doc.activeElement, ok = false;
      host.appendChild(ta);
      try { ta.select(); ok = !!(doc.execCommand && doc.execCommand('copy')); } catch (e) { ok = false; }
      host.removeChild(ta);
      if (prev && prev.isConnected) focusEl(prev);
      return ok;
    }
    function copyText(text) {
      var p = null;
      try { if (win.navigator.clipboard && win.navigator.clipboard.writeText) p = win.navigator.clipboard.writeText(text); } catch (e) { p = null; }
      if (p && typeof p.then === 'function') return p.then(function () { return true; }, function () { return legacyCopy(text); });
      return Promise.resolve(legacyCopy(text));
    }
    function selectText(el) {
      if (!el || !el.isConnected) return;
      if (el.select) {
        try { el.scrollIntoView({ block: 'center' }); } catch (e) { /* nada */ }
        focusEl(el);
        el.select();
        return;
      }
      try {
        var r = doc.createRange(); r.selectNodeContents(el);
        var s = win.getSelection(); s.removeAllRanges(); s.addRange(r);
      } catch (e) { /* nada */ }
    }

    /* ---------- eventos ---------- */
    function onClick(e) {
      var t = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
      if (!t || !rootEl.contains(t) || t.disabled) return;
      var act = t.getAttribute('data-act'), c = t.getAttribute('data-c') || '';
      if ((act === 'dqty' || act === 'qty') && t.getAttribute('aria-disabled') === 'true') {
        if (t.getAttribute('data-d') === '1') toast('Puedes pedir hasta ' + MAX_Q + ' unidades de cada producto.');
        return;
      }
      switch (act) {
        case 'exitpv': if (typeof opts.onExitPreview === 'function') opts.onExitPreview(); break;
        case 'open': if (byCode[c]) openSheet('detail', t, { c: c }); break;
        case 'add': {
          var p = byCode[c];
          if (!p || isOut(p)) return;
          if (addToCart(c, 1)) { flashAdded(t); announce('Agregaste ' + itemLabel(p) + ' al carrito.'); }
          else toast('Puedes pedir hasta ' + MAX_Q + ' unidades de cada producto.');
          break;
        }
        case 'cat': S.cat = t.getAttribute('data-v') || ''; renderChips(); renderGrid(); focusEl(chipsEl.querySelector('[aria-pressed="true"]')); break;
        case 'reset': S.q = ''; S.cat = ''; if (qInput) qInput.value = ''; renderChips(); renderGrid(); focusEl(qInput); break;
        case 'cart': openSheet('cart', t); break;
        case 'close': closeSheet(); break;
        case 'dqty':
          if (!S.detail) return;
          S.detail.q = Math.max(1, Math.min(MAX_Q, S.detail.q + Number(t.getAttribute('data-d'))));
          refreshDetailFoot();
          break;
        case 'dadd': {
          var dp = byCode[S.detail && S.detail.c];
          if (!dp || isOut(dp)) return;
          var got = addToCart(S.detail.c, S.detail.q);
          if (!got) { toast('Ya tienes ' + MAX_Q + ' unidades en tu carrito.'); return; }
          if (got < S.detail.q) toast('Agregamos ' + got + '. El máximo es ' + MAX_Q + ' por producto.');
          S.detail.added = true;
          refreshDetailFoot('#sf-d-gocart');
          break;
        }
        case 'tocart': S.sheet = 'cart'; S.detail = null; renderSheet(true); break;
        case 'checkout': if (!S.cart.length) return; S.sheet = 'checkout'; renderSheet(true); break;
        case 'backco': S.sheet = 'checkout'; renderSheet(true); break;
        case 'qty': changeQty(c, Number(t.getAttribute('data-d'))); break;
        case 'rm': removeItem(c); break;
        case 'share': {
          var sp = byCode[S.detail && S.detail.c];
          if (!sp) return;
          var link = productLink(sp);
          copyText(link).then(function (ok) {
            if (ok) { toast('Enlace copiado. Pégalo donde quieras compartirlo.'); return; }
            var fb = sheet.querySelector('.sf-share-fb');
            if (fb) { fb.hidden = false; selectText(fb.querySelector('input')); }
            toast('Copia el enlace seleccionado.');
          });
          break;
        }
        case 'copyacct': {
          var v = t.getAttribute('data-v') || '';
          copyText(v).then(function (ok) {
            if (ok) toast('Número de cuenta copiado.');
            else { selectText($s('sf-co-pago-det')); toast('Selecciona el número y cópialo.'); }
          });
          break;
        }
        case 'copyorder': {
          if (!checkValid()) return;
          var text = orderText(vstore, S.cart, checkoutObj());
          copyText(text).then(function (ok) {
            if (ok) { toast('Pedido copiado. Pégalo en el chat de WhatsApp de la tienda.'); return; }
            var fb = sheet.querySelector('.sf-copy-fb');
            if (fb) { fb.hidden = false; var ta = fb.querySelector('textarea'); ta.value = text; selectText(ta); }
            toast('Selecciona el texto del pedido y cópialo.');
          });
          break;
        }
        case 'copydone':
          copyText(S.doneText).then(function (ok) {
            if (ok) toast('Mensaje copiado.');
            else { selectText($s('sf-done-msg')); toast('Selecciona el mensaje y cópialo.'); }
          });
          break;
        case 'clear':
          S.cart = []; saveCart(); S.code = null; S.doneText = ''; S.tried = false; S.co.nota = '';
          updateFab(false);
          closeSheet();
          toast('Listo. Tu carrito quedó vacío.');
          break;
        case 'send': onSend(e, t); break;
      }
    }
    function onInput(e) {
      if (e.target === qInput) { S.q = qInput.value; renderGrid(); }
    }
    function onImgError(e) {

    function onSendKey(e) {

      rootEl.removeEventListener('input', onInput);
      rootEl.removeEventListener('error', onImgError, true);
      rootEl.removeEventListener('keydown', onSendKey);
      unlockScroll();
      rootEl.innerHTML = '';
      setVars.forEach(function (k) { rootEl.style.removeProperty(k); });
      rootEl.classList.remove('sf-has-pv');
      if (!hadClass) rootEl.classList.remove('sf');
    }
    return { unmount: unmount };
  }

  window.Storefront = { mount: mount, orderText: orderText, parseHash: parseHash };
})();
</script>
<script>
(function () {
  var root = document.getElementById("store"), data = JSON.parse(document.getElementById("catalog-data").textContent), handle = null;
  function show() {
    var h = window.Storefront.parseHash(location.hash) || {};
    try { handle && handle.unmount && handle.unmount(); } catch (e) {}
    root.innerHTML = "";
    handle = window.Storefront.mount(root, data, { storeId: h.storeId || null, productCode: h.productCode || null, preview: false });
  }
  show();
  window.addEventListener("hashchange", show);
})();
</script></body></html>
